<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Asia | Hệ Thống Quản Trị</title>
    
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
      :root {
        --navy: #0B192C;
        --navy-800: #112240;
        --blue: #1E3E62;
        --gold: #D4AF37;
        --white: #FFFFFF;
        --gray: #94a3b8;
      }
      
      body { 
        margin: 0; 
        font-family: 'Outfit', sans-serif; 
        background: var(--navy); 
        color: var(--white);
        min-height: 100vh;
        overflow: hidden;
      }

      /* Premium Animated Background */
      .bg-animation {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 15% 50%, rgba(30, 62, 98, 0.4), transparent 50%),
                    radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.15), transparent 50%);
      }
      
      .bg-animation::before {
        content: '';
        position: absolute;
        inset: 0;
        background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+') repeat;
        opacity: 0.3;
      }

      /* Login Container */
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        position: relative;
        z-index: 10;
      }

      .login-box { 
        background: rgba(17, 34, 64, 0.7); 
        padding: 50px 40px; 
        border-radius: 24px; 
        border: 1px solid rgba(255,255,255,0.1); 
        text-align: center; 
        width: 100%; 
        max-width: 420px; 
        backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        transform: translateY(20px);
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideUp {
        to { transform: translateY(0); opacity: 1; }
        from { transform: translateY(40px); opacity: 0; }
      }

      .login-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, var(--blue), var(--navy-800));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        border: 2px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      }
      
      .login-logo i {
        font-size: 32px;
        color: var(--gold);
      }

      .login-box h2 { 
        margin: 0 0 8px; 
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.8rem;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .login-box p {
        color: var(--gray);
        font-size: 0.95rem;
        margin-bottom: 32px;
      }

      .input-group {
        position: relative;
        margin-bottom: 20px;
        text-align: left;
      }

      .input-group i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray);
        font-size: 1.1rem;
      }

      input { 
        width: 100%; 
        padding: 16px 16px 16px 48px; 
        border-radius: 12px; 
        border: 1px solid rgba(255,255,255,0.1); 
        background: rgba(0,0,0,0.2); 
        color: white; 
        font-family: 'Outfit', sans-serif;
        font-size: 1rem;
        outline: none; 
        box-sizing: border-box;
        transition: all 0.3s ease;
      }
      
      input:focus {
        border-color: var(--gold);
        background: rgba(0,0,0,0.4);
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
      }

      button { 
        width: 100%; 
        padding: 16px; 
        border-radius: 12px; 
        border: none; 
        background: linear-gradient(135deg, var(--gold), #b89326); 
        color: var(--navy); 
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700; 
        font-size: 1.1rem;
        cursor: pointer; 
        transition: 0.3s; 
        margin-top: 10px;
        box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
      }
      
      button:hover { 
        transform: translateY(-2px);
        box-shadow: 0 15px 25px rgba(212, 175, 55, 0.3);
      }

      #error { 
        color: #ff6b6b; 
        font-size: 0.9rem; 
        margin-bottom: 20px; 
        padding: 10px;
        background: rgba(255, 107, 107, 0.1);
        border-radius: 8px;
        display: none; 
      }
      
      .loader {
        display: none;
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: var(--navy);
        animation: spin 1s ease-in-out infinite;
        margin: 0 auto;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* =========================================
         DECAP CMS PREMIUM OVERRIDES
         ========================================= */
      #nc-root {
        font-family: 'Outfit', sans-serif !important;
      }
      
      /* Make top nav look like Top Asia */
      .nc-appHeader-appHeader {
        background: #0B192C !important;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1) !important;
      }
      .nc-appHeader-siteLink, .nc-appHeader-button {
        color: #D4AF37 !important;
        font-family: 'Space Grotesk', sans-serif !important;
      }
      
      /* Sidebar */
      .nc-collectionPage-sidebar {
        background-color: #f8fafc !important;
        border-right: 1px solid #e2e8f0 !important;
      }
      .nc-collectionPage-sidebarHeading {
        color: #0B192C !important;
        font-family: 'Space Grotesk', sans-serif !important;
        font-weight: 700 !important;
      }
      .nc-collectionPage-sidebarLink {
        border-radius: 8px !important;
        margin: 4px 12px !important;
        transition: 0.2s !important;
      }
      .nc-collectionPage-sidebarLinkActive {
        background-color: #1E3E62 !important;
        color: white !important;
      }
      
      /* Cards */
      .nc-collectionPage-card {
        border-radius: 12px !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
        transition: transform 0.2s !important;
      }
      .nc-collectionPage-card:hover {
        transform: translateY(-4px) !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
      }
      
      /* Buttons */
      .nc-button-button {
        border-radius: 8px !important;
        font-family: 'Space Grotesk', sans-serif !important;
        font-weight: 600 !important;
      }
      .nc-button-gray {
        background: #1E3E62 !important;
        color: white !important;
      }
    </style>
  </head>
  <body>
    <div class="bg-animation" id="bgAnim"></div>
    
    <div class="login-container" id="loginWrapper">
        <div class="login-box" id="loginBox">
          <div class="login-logo">
            <i class="fas fa-crown"></i>
          </div>
          <h2>Quản trị hệ thống</h2>
          <p>Top Asia | Hệ thống quản lý nội dung</p>
          
          <div id="error"><i class="fas fa-exclamation-circle"></i> Sai tài khoản hoặc mật khẩu!</div>
          
          <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Tên đăng nhập" value="admin">
          </div>
          
          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Mật khẩu" value="admin">
          </div>
          
          <button id="loginBtn" onclick="checkLogin()">
            <span id="btnText">Truy cập hệ thống</span>
            <div class="loader" id="btnLoader"></div>
          </button>
        </div>
    </div>

    <script>
      function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const text = document.getElementById('btnText');
        const loader = document.getElementById('btnLoader');
        
        if (u === 'admin' && p === 'admin') {
          text.style.display = 'none';
          loader.style.display = 'block';
          btn.style.pointerEvents = 'none';
          document.getElementById('error').style.display = 'none';
          
          // Giả lập loading 1s cho mượt mà
          setTimeout(() => {
              // Xóa toàn bộ giao diện login
              document.getElementById('loginWrapper').remove();
              document.getElementById('bgAnim').remove();
              
              // Khôi phục body
              document.body.style.background = '#f1f5f9';
              document.body.style.overflow = 'auto';
              
              // Tải Netlify Identity trước
              const s1 = document.createElement('script');
              s1.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
              document.head.appendChild(s1);
              
              s1.onload = () => {
                  // Sau đó tải Decap CMS
                  const s2 = document.createElement('script');
                  s2.src = 'https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js';
                  document.head.appendChild(s2);
              };
          }, 800);
        } else {
          document.getElementById('error').style.display = 'block';
          document.getElementById('password').value = '';
        }
      }
    </script>
  </body>
</html>
