backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

local_backend: true

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "news"
    label: "Tin tức (News)"
    folder: "src/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Ảnh đại diện", name: "image", widget: "image"}
      - {label: "Thẻ (Tag)", name: "tag", widget: "string", default: "Tin tức"}
      - {label: "Ngày đăng", name: "date", widget: "datetime"}
      - {label: "Nội dung tóm tắt", name: "summary", widget: "text"}
      - {label: "Nội dung bài viết", name: "body", widget: "markdown"}

  - name: "products"
    label: "Sản phẩm (Products)"
    folder: "src/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên sản phẩm", name: "title", widget: "string"}
      - {label: "Phân khúc (Vd: LUXURY)", name: "badge", widget: "string"}
      - {label: "Ảnh sản phẩm", name: "image", widget: "image"}
      - {label: "Mô tả ngắn", name: "description", widget: "text"}
      - {label: "Nội dung giới thiệu", name: "body", widget: "markdown"}

  - name: "settings"
    label: "Cài đặt chung (Settings)"
    editor:
      preview: false
    files:
      - label: "Thông tin Website"
        name: "general"
        file: "src/_data/site.json"
        fields:
          - {label: "Tên Website", name: "title", widget: "string"}
          - {label: "Mô tả SEO", name: "description", widget: "text"}
          - {label: "Hotline", name: "phone", widget: "string"}
          - {label: "Email liên hệ", name: "email", widget: "string"}
          - {label: "Địa chỉ Văn phòng", name: "address", widget: "string"}
          - {label: "Địa chỉ Nhà máy", name: "factory", widget: "string"}
          - {label: "Link Facebook", name: "facebook", widget: "string", required: false}
          - {label: "Link Youtube", name: "youtube", widget: "string", required: false}
          - {label: "Link TikTok", name: "tiktok", widget: "string", required: false}
          - {label: "Link Zalo", name: "zalo", widget: "string", required: false}

